name: Bug report
description: Diagnose broken installation or model routing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, tokens, private paths, and sensitive logs before submitting."
  - type: input
    id: environment
    attributes:
      label: Platform and Codex client/version
      placeholder: Windows 11 / Codex desktop or CLI
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
