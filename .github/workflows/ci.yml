name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package locally
        run: |
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI
        run: python -m codex_triad --help
      - name: Compile sources
        run: python -m compileall -q src tests tools scripts
      - name: Build and inspect release artifacts
        run: python tools/build_release.py
      - name: Verify wheel and standalone skill
        run: python tools/check_wheel.py
      - name: Upload preview artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: codex-triad-preview
          path: |
            dist/*.whl
            dist/*-source.zip
            dist/*-skill.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
